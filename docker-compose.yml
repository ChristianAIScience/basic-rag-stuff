# Services for the RAG Learning Lab:
#   postgres - PostgreSQL 17 with the pgvector extension (data in ./postgres-data)
#   mlflow   - MLflow tracking server and UI on http://localhost:5000 (data in ./mlflow-data)
# Start:  docker compose up -d
# Stop:   docker compose down
#
# The data folders live in this project folder, so they survive `docker compose down`,
# deleting the containers and even reinstalling Docker.
# Reset the vector database: docker compose down, then delete ./postgres-data
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_learning}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 2s
      retries: 15

  # MLflow tracking server: experiment runs, metrics and LangChain/LangGraph traces.
  # UI: http://localhost:5000  - data (SQLite + artifacts) lives in ./mlflow-data.
  # Reset: docker compose down, then delete ./mlflow-data
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"   # reachable from this PC only
    volumes:
      - ./mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 24
